apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace, its RBAC and the aoc-progress-announcer-env Secret are managed by infra-tg (Terragrunt).
namespace: aoc-progress-announcer

resources:
  - pvc.yaml
  - cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/name: aoc-progress-announcer

# The deploy job sets newTag to the commit SHA (kustomize edit set image).
images:
  - name: app
    newName: ghcr.io/davvos11/adventofcodeprogressannouncer
    newTag: latest
